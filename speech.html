<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Speech Recognition Form Filler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .pulse {
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .active-field {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
            border-color: #3B82F6;
        }

        #global-mic-btn.listening {
            background-color: #EF4444;
            /* red-500 */
        }

        #global-mic-btn.listening:hover {
            background-color: #DC2626;
            /* red-600 */
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-2xl mx-4">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Enhanced Speech-to-Text Form</h1>
            <p class="text-gray-500 mt-2">Use voice commands like "next field", "submit form", or "stop listening".</p>
        </div>

        <!-- Controls -->
        <div class="flex flex-col sm:flex-row items-center justify-between mb-6 gap-4">
            <div class="flex items-center gap-2">
                <label for="language" class="text-sm font-medium text-gray-700">Language:</label>
                <select id="language"
                    class="rounded-lg border-gray-300 focus:ring-blue-500 focus:border-blue-500 text-sm">
                    <!-- Languages will be populated by JS -->
                </select>
            </div>
            <button id="global-mic-btn"
                class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-all duration-200">
                <i class="fas fa-microphone-alt"></i>
                <span id="global-mic-text">Fill Entire Form</span>
            </button>
        </div>

        <!-- Status Indicators -->
        <div id="unsupported-alert"
            class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4" role="alert">
            <strong class="font-bold">Heads up!</strong> <span class="block sm:inline">Speech recognition is not
                supported here. Try Chrome or Edge.</span>
        </div>
        <div id="listening-status"
            class="hidden items-center justify-center bg-blue-100 text-blue-800 p-3 rounded-lg mb-4 transition-all duration-300">
            <i class="fas fa-microphone-alt text-xl mr-3 pulse text-blue-500"></i>
            <div>
                <span class="font-medium">Listening...</span>
                <p id="interim-transcript" class="text-sm text-blue-600 h-5"></p>
            </div>
        </div>

        <form id="contact-form" class="space-y-6">
            <!-- Form fields remain the same -->
            <div class="relative">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="name" name="name"
                    class="form-input w-full pl-3 pr-12 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    placeholder="e.g., Jane Doe">
                <button type="button"
                    class="mic-button absolute inset-y-0 right-0 top-6 flex items-center pr-4 text-gray-500 hover:text-blue-600"
                    data-target="name">
                    <i class="fas fa-microphone-alt fa-lg"></i>
                </button>
            </div>
            <div class="relative">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email"
                    class="form-input w-full pl-3 pr-12 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    placeholder="e.g., you@example.com">
                <button type="button"
                    class="mic-button absolute inset-y-0 right-0 top-6 flex items-center pr-4 text-gray-500 hover:text-blue-600"
                    data-target="email">
                    <i class="fas fa-microphone-alt fa-lg"></i>
                </button>
            </div>
            <div class="relative">
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
                <textarea id="message" name="message" rows="4"
                    class="form-input w-full pl-3 pr-12 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                    placeholder="Tell us what you're thinking..."></textarea>
                <button type="button"
                    class="mic-button absolute top-9 right-0 flex items-center pr-4 text-gray-500 hover:text-blue-600"
                    data-target="message">
                    <i class="fas fa-microphone-alt fa-lg"></i>
                </button>
            </div>

            <div class="flex items-center justify-end space-x-4 pt-2">
                <button type="button" id="clear-btn"
                    class="px-6 py-2 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-100 transition-all duration-200">Clear</button>
                <button type="submit"
                    class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200">Submit</button>
            </div>
        </form>
    </div>

    <!-- Submission Result Modal -->
    <div id="submission-modal"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-4 transform transition-all">
            <div class="text-center">
                <h3 class="text-2xl font-bold text-gray-800">Form Submitted!</h3>
                <p class="text-gray-500 mt-2">Here is the data you provided:</p>
                <div id="modal-content" class="mt-6 text-left space-y-3 bg-gray-50 p-4 rounded-lg">
                    <!-- Results will be injected here -->
                </div>
                <div class="mt-8">
                    <button id="modal-close-btn"
                        class="w-full px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                document.getElementById('unsupported-alert').classList.remove('hidden');
                document.querySelectorAll('.mic-button, #global-mic-btn').forEach(btn => btn.disabled = true);
                return;
            }

            const recognition = new SpeechRecognition();
            const form = document.getElementById('contact-form');
            const formInputs = Array.from(form.querySelectorAll('.form-input'));
            const listeningStatus = document.getElementById('listening-status');
            const interimTranscriptEl = document.getElementById('interim-transcript');
            const globalMicBtn = document.getElementById('global-mic-btn');
            const globalMicText = document.getElementById('global-mic-text');
            const languageSelect = document.getElementById('language');
            const submissionModal = document.getElementById('submission-modal');
            const modalContent = document.getElementById('modal-content');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            let activeInput = null;
            let isContinuousMode = false;
            let finalTranscript = '';

            // --- Language Options ---
            const languages = [
                ['English (US)', 'en-US'], ['Español (España)', 'es-ES'],
                ['Français (France)', 'fr-FR'], ['Deutsch (Deutschland)', 'de-DE'],
                ['Italiano (Italia)', 'it-IT'], ['日本語 (日本)', 'ja-JP'],
                ['Português (Brasil)', 'pt-BR'], ['Русский (Россия)', 'ru-RU']
            ];
            languages.forEach(([name, code]) => {
                const option = new Option(name, code);
                languageSelect.add(option);
            });

            // --- Recognition Setup ---
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            const startRecognition = (isContinuous = false) => {
                if (recognition.running) return;
                recognition.lang = languageSelect.value;
                recognition.continuous = isContinuous;
                isContinuousMode = isContinuous;
                finalTranscript = '';
                try {
                    recognition.start();
                    recognition.running = true;
                    listeningStatus.classList.remove('hidden');
                    listeningStatus.classList.add('flex');
                    if (isContinuous) {
                        globalMicBtn.classList.add('listening');
                        globalMicText.textContent = 'Stop Listening';
                    }
                } catch (e) {
                    console.error("Recognition start error:", e);
                }
            };

            const stopRecognition = () => {
                recognition.stop();
                recognition.running = false;
                listeningStatus.classList.add('hidden');
                interimTranscriptEl.textContent = '';
                if (activeInput) {
                    activeInput.classList.remove('active-field');
                    activeInput = null;
                }
                globalMicBtn.classList.remove('listening');
                globalMicText.textContent = 'Fill Entire Form';
                isContinuousMode = false;
            };

            // --- Event Listeners ---
            languageSelect.addEventListener('change', () => {
                if (recognition.running) {
                    stopRecognition();
                    startRecognition(isContinuousMode);
                }
            });

            globalMicBtn.addEventListener('click', () => {
                if (recognition.running) {
                    stopRecognition();
                } else {
                    activeInput = formInputs[0];
                    activeInput.focus();
                    activeInput.classList.add('active-field');
                    startRecognition(true);
                }
            });

            document.querySelectorAll('.mic-button').forEach(button => {
                button.addEventListener('click', () => {
                    if (recognition.running) stopRecognition();
                    const targetId = button.dataset.target;
                    activeInput = document.getElementById(targetId);
                    activeInput.focus();
                    activeInput.classList.add('active-field');
                    startRecognition(false);
                });
            });

            document.getElementById('clear-btn').addEventListener('click', () => form.reset());

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                stopRecognition(); // Stop listening on submit
                const formData = new FormData(form);
                modalContent.innerHTML = ''; // Clear previous results
                for (let [key, value] of formData.entries()) {
                    const p = document.createElement('p');
                    const capitalizedKey = key.charAt(0).toUpperCase() + key.slice(1);
                    p.innerHTML = `<strong class="font-medium text-gray-700">${capitalizedKey}:</strong> <span class="text-gray-600">${value || 'N/A'}</span>`;
                    modalContent.appendChild(p);
                }
                submissionModal.classList.remove('hidden');
                form.reset();
            });

            const closeModal = () => {
                submissionModal.classList.add('hidden');
            };

            modalCloseBtn.addEventListener('click', closeModal);
            submissionModal.addEventListener('click', (e) => {
                // Close modal if backdrop is clicked
                if (e.target === submissionModal) {
                    closeModal();
                }
            });


            // --- Recognition Handlers ---
            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                interimTranscriptEl.textContent = interimTranscript;

                if (finalTranscript && activeInput) {
                    if (isContinuousMode) {
                        if (!handleCommand(finalTranscript.toLowerCase().trim())) {
                            setInputValue(activeInput, finalTranscript);
                        }
                    } else {
                        setInputValue(activeInput, finalTranscript);
                    }
                    finalTranscript = '';
                }
            };

            recognition.onend = () => {
                if (isContinuousMode) {
                    // In continuous mode, don't stop unless the user clicks the button
                    if (recognition.running) {
                        return;
                    }
                }
                stopRecognition();
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopRecognition();
            };

            // --- Helper Functions ---
            const setInputValue = (input, value) => {
                let processedValue = value.charAt(0).toUpperCase() + value.slice(1).trim() + ' ';
                if (input.id === 'email') {
                    processedValue = value.replace(/\s/g, '').toLowerCase();
                }
                // Append text instead of replacing for message box in continuous mode
                if (input.id === 'message' && isContinuousMode) {
                    input.value += processedValue;
                } else {
                    input.value = processedValue.trim();
                }
            };

            const handleCommand = (command) => {
                const currentIndex = formInputs.indexOf(activeInput);

                if (command.includes('next field') || command.includes('next')) {
                    const nextIndex = (currentIndex + 1) % formInputs.length;
                    switchField(formInputs[nextIndex]);
                    return true;
                }
                if (command.includes('previous field') || command.includes('previous')) {
                    const prevIndex = (currentIndex - 1 + formInputs.length) % formInputs.length;
                    switchField(formInputs[prevIndex]);
                    return true;
                }
                if (command.includes('go to name') || command.includes('focus name')) {
                    switchField(document.getElementById('name'));
                    return true;
                }
                if (command.includes('go to email') || command.includes('focus email')) {
                    switchField(document.getElementById('email'));
                    return true;
                }
                if (command.includes('go to message') || command.includes('focus message')) {
                    switchField(document.getElementById('message'));
                    return true;
                }
                if (command.includes('clear form') || command.includes('reset form')) {
                    form.reset();
                    return true;
                }
                if (command.includes('clear name')) {
                    document.getElementById('name').value = '';
                    return true;
                }
                if (command.includes('clear email')) {
                    document.getElementById('email').value = '';
                    return true;
                }
                if (command.includes('clear message')) {
                    document.getElementById('message').value = '';
                    return true;
                }
                if (command.includes('submit form') || command.includes('submit')) {
                    form.dispatchEvent(new Event('submit', { cancelable: true }));
                    return true;
                }
                if (command.includes('stop listening')) {
                    stopRecognition();
                    return true;
                }

                return false;
            };

            const switchField = (newField) => {
                if (activeInput) activeInput.classList.remove('active-field');
                activeInput = newField;
                activeInput.focus();
                activeInput.classList.add('active-field');
            };
        });
    </script>
</body>

</html>
